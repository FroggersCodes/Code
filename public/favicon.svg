<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#0a0a0a" rx="6"/>
  <!-- Bug body -->
  <ellipse cx="16" cy="17" rx="6" ry="7" fill="#00ff41"/>
  <!-- Bug head -->
  <circle cx="16" cy="10" r="4" fill="#00ff41"/>
  <!-- Eyes -->
  <circle cx="14.5" cy="9.5" r="1" fill="#0a0a0a"/>
  <circle cx="17.5" cy="9.5" r="1" fill="#0a0a0a"/>
  <!-- Antennae -->
  <line x1="14" y1="7" x2="11" y2="4" stroke="#00ff41" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="7" x2="21" y2="4" stroke="#00ff41" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="11" cy="4" r="1" fill="#00ff41"/>
  <circle cx="21" cy="4" r="1" fill="#00ff41"/>
