  <line x1="10" y1="17" x2="6" y2="16" stroke="#00ff41" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="10" y1="20" x2="6" y2="21" stroke="#00ff41" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="14" x2="26" y2="12" stroke="#00ff41" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="17" x2="26" y2="16" stroke="#00ff41" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="22" y1="20" x2="26" y2="21" stroke="#00ff41" stroke-width="1.2" stroke-linecap="round"/>
</svg>
